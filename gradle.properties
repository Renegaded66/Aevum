# Release-Lint analysiert große Compose-Dateien über Kotlin FIR und benötigt
# deutlich mehr Class-Metadata als ein normaler Debug-Build. Der alte Wert von
# 384 MB löste dabei einen Metaspace-OOM in GoalEditorScreen aus.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8 -XX:+UseSerialGC -XX:MaxMetaspaceSize=768m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kapt.use.worker.api=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# M18.150 (Play-Console-Auflage "R8-Optimierung", Release "Google play policy
# fix"): Optimierte Entfernung von Ressourcen aktiviert — die Console
# beanstandete "Optimierte Entfernung von Ressourcen ist nicht aktiviert".
# Voraussetzungen geprueft: KEINE getIdentifier()/dynamischen Ressourcen-
# Zugriffe im Code (klassische Stolperfalle dieser Optimierung), alle
# Ressourcen laufen ueber R-Referenzen bzw. den XML-Referenzgraphen.
android.r8.optimizedResourceShrinking=true
android.builtInKotlin=false
android.newDsl=false
